<section class="fr">
  <header class="fr__head">
    <div>
      <span class="eyebrow fr__eyebrow">Resultados finales</span>
      <h1 class="fr__title">¡Partida terminada!</h1>
    </div>
    <span class="fr__trophy" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 4h8v5a4 4 0 01-8 0V4z" /><path d="M8 6H4v1a3 3 0 003 3M16 6h4v1a3 3 0 01-3 3" />
        <path d="M12 13v4M8.5 20h7" />
      </svg>
    </span>
  </header>

  <app-podium [entries]="top()" />

  @if (rest().length) {
    <div class="fr__rest">
      <div class="fr__rest-head">
        <h2>Clasificación</h2>
        <span>{{ entries().length }} jugadores</span>
      </div>
      <ol class="fr__list">
        @for (e of rest(); track e.socketId) {
          <li><app-rank-row [entry]="e" [highlight]="e.socketId === mySocketId()" /></li>
        }
      </ol>
    </div>
  }

  <footer class="fr__actions">
    @if (role() === 'host') {
      <button type="button" class="btn btn--accent" (click)="playAgain.emit()">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20 12a8 8 0 11-2.3-5.7M20 4v5h-5" />
        </svg>
        Jugar de nuevo
      </button>
    }
    <button type="button" class="btn btn--ghost" (click)="leave.emit()">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M10 4H6a2 2 0 00-2 2v12a2 2 0 002 2h4M15 8l4 4-4 4M19 12H9" />
      </svg>
      Salir
    </button>
  </footer>
</section>
