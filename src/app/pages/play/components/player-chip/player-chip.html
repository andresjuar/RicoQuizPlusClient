<div class="chip" [class.chip--host]="isHost()" [class.chip--offline]="!player().isConnected">
  <app-avatar [name]="player().displayName" [size]="32" />
  <span class="chip__name">{{ player().displayName }}</span>

  @if (isHost()) {
    <svg class="chip__icon chip__icon--host" viewBox="0 0 24 24" width="18" height="18" fill="none"
         stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="Anfitrión">
      <path d="M3 8l4.5 4L12 5l4.5 7L21 8l-2 11H5L3 8z" />
    </svg>
  } @else if (player().isConnected) {
    <svg class="chip__icon chip__icon--ok" viewBox="0 0 24 24" width="18" height="18" fill="none"
         stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="Conectado">
      <circle cx="12" cy="12" r="9" /><path d="M8 12.5l3 3 5-6" />
    </svg>
  }
</div>
