<section class="rv">
  <span class="eyebrow">Pregunta {{ question().questionIndex + 1 }} de {{ question().totalQuestions }}</span>

  <div class="rv__banner" [attr.data-result]="result()" role="status">
    <span class="rv__icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="3"
           stroke-linecap="round" stroke-linejoin="round">
        @switch (result()) {
          @case ('correct') { <path d="M5 12.5l4.5 4.5L19 7.5" /> }
          @case ('wrong') { <path d="M6 6l12 12M18 6L6 18" /> }
          @default { <circle cx="12" cy="12" r="8" /><path d="M12 7.5V12l3 2" /> }
        }
      </svg>
    </span>
    <div>
      <strong class="rv__title">{{ title() }}</strong>
      @if (result() !== 'correct') {
        <p class="rv__sub">La respuesta correcta era: <b>{{ revealed().correctText }}</b></p>
      }
    </div>
  </div>

  <h1 class="rv__text">{{ question().question }}</h1>

  <div class="rv__options">
    @for (opt of question().options; track $index) {
      <app-answer-option [index]="$index" [label]="opt" [state]="stateOf($index)" [disabled]="true" />
    }
  </div>
</section>
