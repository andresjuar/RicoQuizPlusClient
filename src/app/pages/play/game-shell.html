<main class="shell">
  @switch (phase()) {
    @case ('guest-gate') {
      <app-guest-gate [code]="code()" (joined)="onJoined($event)" />
    }
    @case ('lobby') {
      <app-lobby [role]="role" [code]="code()" [players]="players" [hostSocketId]="hostSocketId" (start)="onStart()" />
    }
    @case ('loading') {
      <app-loading />
    }
    @case ('question') {
      <app-question [question]="question" [secondsLeft]="secondsLeft()" [myAnswer]="myAnswer()"
                    (answer)="onAnswer($event)" />
    }
    @case ('reveal') {
      <app-reveal [question]="question" [revealed]="revealed" [myAnswer]="myAnswer()" />
    }
    @case ('leaderboard') {
      <app-leaderboard [entries]="leaderboard" [mySocketId]="mySocketId" />
    }
    @case ('finished') {
      <app-final-results [entries]="leaderboard" [mySocketId]="mySocketId"
                         (playAgain)="onPlayAgain()" (leave)="onLeave()" />
    }
  }

  @if (phase() === 'reveal' || phase() === 'leaderboard') {
    <button type="button" class="btn btn--ghost shell__dev" (click)="onNext()">Siguiente (dev) →</button>
  }
</main>
