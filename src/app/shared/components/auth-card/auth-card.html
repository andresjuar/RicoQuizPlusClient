<section class="auth">
  <div class="auth__card">

      <h1 class="auth__title">{{ heading() }}</h1>
      @if (subtitle()) { <p class="auth__subtitle">{{ subtitle() }}</p> }
    </header>

    <ng-content />

    <footer class="auth__footer">
      <ng-content select="[authFooter]" />
    </footer>
  </div>
</section>
